# Render Blueprint for the INUKA backend (free plan). See HOSTING.md.
# Secrets marked "sync: false" are typed in the Render dashboard, never committed.
services:
  - type: web
    name: inuka-api
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm install && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "2"
      - key: APP_TIMEZONE
        value: Africa/Kigali
      - key: STORAGE_DRIVER
        value: s3
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
